[project]
name = "ekin-kanban"
dynamic = ["version"]
description = "Ekin Kanban - Sleek, offline-first personal Kanban board with per-task journaling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "PySide6>=6.6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["main", "board_view", "sidebar", "styles", "widgets", "version", "calendar_view", "ics_export", "backups", "search_dialog", "exporter", "settings_dialog", "shortcuts_dialog", "undo", "strings"]
packages = ["database", "detail_dialog"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["venv"]

[tool.ruff.lint]
# High-signal rules only: pyflakes (real bugs — unused imports, undefined names) plus
# import/statement/syntax errors. Cosmetic whitespace (W29x) and line-length (E501) are
# intentionally left off to avoid churn on the existing inline-QSS-heavy code.
select = ["E4", "E7", "E9", "F"]
