[project]
name = "ekin-kanban"
dynamic = ["version"]
description = "Ekin Kanban - Sleek, offline-first personal Kanban board with per-task journaling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "PySide6>=6.6.0,<7",
    "pygments>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = [
    "analytics", "backups",
    "board_dialogs", "board_mixins", "board_sync", "board_sync_controller",
    "board_template_dialogs", "board_view", "bulk_add_dialog", "calendar_view",
    "cloud_sync_dialog", "color_picker", "command_palette", "dashboard_view",
    "ekin_mcp", "export_dialog", "exporter", "html_utils", "icons",
    "ics_export", "importer", "local_ai", "logging_setup", "main",
    "mcp_server", "mcp_sync_dialog", "my_work_view", "onboarding_dialog",
    "reminders", "search_dialog", "settings_dialog", "shortcuts_dialog",
    "sidebar", "strings", "styles", "templates", "undo", "version", "widgets"
]
packages = ["database", "detail_dialog"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
extend-exclude = ["venv"]

[tool.ruff.lint]
# High-signal rules only: pyflakes (real bugs — unused imports, undefined names) plus
# import/statement/syntax errors. Cosmetic whitespace (W29x) and line-length (E501) are
# intentionally left off to avoid churn on the existing inline-QSS-heavy code.
select = ["E4", "E7", "E9", "F"]
