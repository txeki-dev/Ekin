name: CI

# Runs ruff + pytest (Python 3.12) on every push to main and on pull requests. This is the
# quality gate; the release workflow runs the full 3.10–3.12 matrix before it builds.
# Docs-only pushes and graphify refreshes don't need it, so they skip it.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "graphify-out/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "graphify-out/**"

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (py3.12)
    runs-on: ubuntu-latest
    env:
      # PySide6 modules import fine headless with the offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system libraries for Qt (PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libglib2.0-0 libdbus-1-3
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Run tests
        run: pytest -q
