name: Release on version bump

# Whenever main is updated, read version.py. If there is no git tag for that version
# yet:
# 1. Compiles standalone package with PyInstaller on Windows.
# 2. Builds the Windows installer with Inno Setup (ISCC).
# 3. Creates git tag + GitHub Release with notes from CHANGELOG.md and attaches the installer .exe.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build Installer & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from version.py
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content version.py -Raw
          if ($content -match '__version__\s*=\s*["'']([^"'']+)["'']') {
            $version = $matches[1]
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Detected version: $version"
          } else {
            Write-Error "Could not parse version from version.py"
            exit 1
          }

      - name: Skip if tag already exists
        id: check
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $existing = git tag -l "v$ver"
          if ($existing) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Tag v$ver already exists — nothing to release."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Tag v$ver does not exist yet — proceeding with release."
          }

      - name: Build release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python .github/scripts/extract_release_notes.py "$env:VERSION" | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          if (-not (Test-Path RELEASE_NOTES.md) -or (Get-Item RELEASE_NOTES.md).Length -eq 0) {
            "Release v$env:VERSION`n`nSee [CHANGELOG.md](CHANGELOG.md) for details." | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          }
          Write-Host "----- release notes -----"
          Get-Content RELEASE_NOTES.md

      - name: Install dependencies & build tools
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Package application with PyInstaller
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          pyinstaller ekin.spec --noconfirm --clean

      - name: Compile Windows Installer with Inno Setup
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
          if (-not $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              Write-Host "Installing Inno Setup via Chocolatey..."
              choco install innosetup --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & "$iscc" "/DMyAppVersion=$env:VERSION" installer.iss

      - name: Create tag and GitHub Release with Installer asset
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $installerPath = "Output\Ekin-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer binary not found at $installerPath"
            exit 1
          }
          gh release create "v$env:VERSION" `
            --target "$env:GITHUB_SHA" `
            --title "v$env:VERSION" `
            --notes-file RELEASE_NOTES.md `
            $installerPath
